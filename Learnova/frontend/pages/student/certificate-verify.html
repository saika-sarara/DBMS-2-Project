<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate - Learnova</title>
</head>
<body>
<main id="certificate-verification">
    <h1>Certificate Verification</h1>
    <p id="verification-state">Checking the certificate code...</p>
</main>
<script src="../../js/utils/constants.js"></script>
<script src="../../js/api/apiClient.js"></script>
<script src="../../js/api/certificateApi.js"></script>
<script>
    (function () {
        var state = document.getElementById('verification-state');
        var code = new URLSearchParams(window.location.search).get('code');
        if (!code) {
            state.textContent = 'No certificate code was supplied.';
            return;
        }
        LearnovaCertificateApi.verify(code)
            .then(function (response) {
                var certificate = response && response.data !== undefined
                    ? response.data
                    : response;
                state.textContent =
                    'Valid certificate for ' + certificate.holderName +
                    ' - ' + certificate.entityTitle +
                    ' (issued ' + certificate.issuedAt + ').';
            })
            .catch(function () {
                state.textContent = 'This certificate could not be verified.';
            });
    })();
</script>
</body>
</html>
