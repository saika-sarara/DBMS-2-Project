<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Editor - Learnova</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../../css/base/reset.css">

    <link rel="stylesheet" href="../../css/pages/instructor.css">

    <style>
        * {
            font-family:
                'Cormorant Garamond',
                serif !important;
        }


        .course-editor-heading-actions {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
    </style>

</head>


<body data-page="course-editor">


    <header class="top-nav">

        <a href="../../index.html" class="logo">
            Learnova
        </a>


        <div class="header-actions">

            <div class="role-pill">

                Instructor

                <i class="fa-solid fa-chevron-down"></i>

            </div>


            <button class="icon-btn" type="button" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>


            <a class="profile-btn" href="../common/profile.html" aria-label="Profile">
                <i class="fa-solid fa-user"></i>
            </a>

        </div>

    </header>


    <nav class="secondary-nav" aria-label="Instructor navigation">

        <a class="tab" href="dashboard.html">
            Dashboard
        </a>


        <a class="tab active" href="courses.html" aria-current="page">
            Courses
        </a>


        <a class="tab" href="quiz-editor.html">
            Quiz Bank
        </a>

    </nav>


    <main class="main-content">


        <div class="section-heading">


            <div>

                <h1 class="page-title">
                    Course Editor
                </h1>

                <p class="subtitle">
                    Configure settings, prerequisites and curriculum.
                </p>

            </div>


            <div class="course-editor-heading-actions">

                <a class="btn btn-outline" id="prerequisitesLink" href="courses.html">
                    <i class="fa-solid fa-diagram-project"></i>
                    Prerequisites
                </a>


                <a class="btn btn-outline" href="courses.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Courses
                </a>

            </div>


        </div>


        <div class="editor-grid">


            <!-- ==================================================
                 Course settings
                 ================================================== -->

            <section class="card editor-panel">

                <h3>
                    Course Settings
                </h3>


                <div class="form-field">

                    <label for="courseTitle">
                        Course Title
                    </label>

                    <input type="text" id="courseTitle" placeholder="e.g. Database Design Fundamentals">

                </div>


                <div class="form-field">

                    <label for="courseDescription">
                        Course Description
                    </label>

                    <textarea id="courseDescription" placeholder="Describe what students will learn..."></textarea>

                </div>


                <div class="form-field">

                    <label for="courseCategory">
                        Category
                    </label>

                    <select id="courseCategory">

                        <option value="">
                            Loading categories...
                        </option>

                    </select>

                </div>


                <div class="form-field">

                    <label for="courseDifficulty">
                        Difficulty
                    </label>

                    <select id="courseDifficulty">

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="intermediate">
                            Intermediate
                        </option>

                        <option value="advanced">
                            Advanced
                        </option>

                    </select>

                </div>


                <button class="btn btn-primary btn-block" id="saveSettingsBtn" type="button">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Course Settings
                </button>

            </section>


            <!-- ==================================================
                 Curriculum
                 ================================================== -->

            <section class="editor-panel">

                <h3>
                    Curriculum Builder
                </h3>


                <p style="
                        color: #5f5f7a;
                        font-size: 1.15rem;
                        margin-bottom: 1.2rem;
                    ">
                    Organize your course into modules and lessons.
                    Each lesson has its own content editor and quiz.
                </p>


                <div class="curriculum" id="curriculum"></div>


                <button class="btn-add btn-block" id="addModuleBtn" type="button">
                    + Add Module
                </button>

            </section>


        </div>


    </main>


    <script src="../../js/utils/constants.js"></script>

    <script src="../../js/auth/session.js"></script>

    <script src="../../js/auth/routeGuard.js"></script>

    <script src="../../js/shared/dashboardHeader.js"></script>

    <script src="../../js/components/dialogs.js"></script>

    <script src="../../js/api/apiClient.js"></script>

    <script src="../../js/api/courseApi.js"></script>

    <script src="../../js/api/instructorApi.js"></script>


    <script>
        LearnovaRouteGuard.protectPage([
            LearnovaConstants.ROLES.INSTRUCTOR,
            LearnovaConstants.ROLES.ADMIN
        ]);
    </script>


    <script src="../../js/pages/instructor/courseEditor.js"></script>


</body>

</html>
