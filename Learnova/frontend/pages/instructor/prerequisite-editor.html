<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prerequisite Editor - Learnova</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../../css/base/reset.css">

    <link rel="stylesheet" href="../../css/pages/instructor.css">

    <style>
        * {
            font-family:
                'Cormorant Garamond',
                serif !important;
        }


        .prerequisite-layout {
            display: grid;
            grid-template-columns:
                minmax(280px, 0.8fr) minmax(0, 1.6fr);
            gap: 1.5rem;
            align-items: start;
        }


        .prerequisite-target-title {
            margin: 0;
            color: #1800ad;
            font-size: 1.7rem;
            font-weight: 700;
        }


        .prerequisite-target-meta {
            margin-top: 0.55rem;
            color: #5f5f7a;
            font-size: 1.1rem;
        }


        .prerequisite-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1rem;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            background: #eef2ff;
            color: #1800ad;
            font-weight: 700;
        }


        .prerequisite-readonly {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            background: #fff8e7;
            color: #7a5710;
            line-height: 1.45;
        }


        .prerequisite-add-row {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr) 150px auto;
            gap: 0.8rem;
            align-items: end;
            margin-bottom: 1.4rem;
        }


        .prerequisite-add-row .form-field {
            margin-bottom: 0;
        }


        .prerequisite-score-input {
            width: 100%;
        }


        .prerequisite-editor-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }


        .prerequisite-editor-item {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr) 150px auto;
            gap: 1rem;
            align-items: center;
            padding: 1rem 1.1rem;
            border: 1px solid rgba(24, 0, 173, 0.12);
            border-radius: 14px;
            background: #ffffff;
        }


        .prerequisite-course-name {
            color: #1800ad;
            font-size: 1.25rem;
            font-weight: 700;
        }


        .prerequisite-course-meta {
            margin-top: 0.2rem;
            color: #77778c;
            font-size: 0.98rem;
        }


        .prerequisite-score-label {
            display: block;
            margin-bottom: 0.25rem;
            color: #5f5f7a;
            font-size: 0.95rem;
            font-weight: 600;
        }


        .prerequisite-remove {
            width: 40px;
            height: 40px;
            border: 1px solid #e11d48;
            border-radius: 50%;
            background: transparent;
            color: #e11d48;
            cursor: pointer;
            font-size: 1.1rem;
        }


        .prerequisite-remove:hover {
            background: #e11d48;
            color: #ffffff;
        }


        .prerequisite-save-row {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.4rem;
        }


        .prerequisite-loading,
        .prerequisite-error {
            padding: 2.5rem 1rem;
            text-align: center;
            color: #5f5f7a;
        }


        .prerequisite-loading i,
        .prerequisite-error i {
            display: block;
            margin-bottom: 0.8rem;
            color: #1800ad;
            font-size: 2rem;
        }


        @media (max-width: 900px) {

            .prerequisite-layout {
                grid-template-columns: 1fr;
            }


            .prerequisite-add-row,
            .prerequisite-editor-item {
                grid-template-columns: 1fr;
            }


            .prerequisite-remove {
                width: 100%;
                border-radius: 8px;
            }
        }
    </style>
</head>


<body data-page="prerequisites">


    <!-- ======================================================
         Header
         ====================================================== -->

    <header class="top-nav">

        <a href="../../index.html" class="logo">
            Learnova
        </a>


        <div class="header-actions">

            <div class="role-pill">
                Instructor
                <i class="fa-solid fa-chevron-down"></i>
            </div>


            <button class="icon-btn" type="button" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>


            <a class="profile-btn" href="../common/profile.html" aria-label="Profile">
                <i class="fa-solid fa-user"></i>
            </a>

        </div>

    </header>


    <!-- ======================================================
         Instructor navigation
         ====================================================== -->

    <nav class="secondary-nav" aria-label="Instructor navigation">

        <a class="tab" href="dashboard.html">
            Dashboard
        </a>


        <a class="tab active" href="courses.html" aria-current="page">
            Courses
        </a>


        <a class="tab" href="quiz-editor.html">
            Quiz Bank
        </a>

    </nav>


    <!-- ======================================================
         Content
         ====================================================== -->

    <main class="main-content">


        <div class="section-heading">

            <div>

                <h1 class="page-title">
                    Prerequisite Editor
                </h1>

                <p class="subtitle">
                    Define every course a student must complete
                    before enrolling in this course.
                </p>

            </div>


            <a class="btn btn-outline" id="backToCourseEditor" href="courses.html">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Course
            </a>

        </div>


        <div id="prerequisitePage">

            <div class="card prerequisite-loading">

                <i class="fa-solid fa-arrows-rotate"></i>

                Loading prerequisite settings...

            </div>

        </div>


    </main>


    <!-- ======================================================
         Infrastructure
         ====================================================== -->

    <script src="../../js/utils/constants.js"></script>

    <script src="../../js/auth/session.js"></script>

    <script src="../../js/auth/routeGuard.js"></script>

    <script src="../../js/shared/dashboardHeader.js"></script>

    <script src="../../js/components/dialogs.js"></script>

    <script src="../../js/api/apiClient.js"></script>

    <script src="../../js/api/prerequisiteApi.js"></script>


    <script>
        LearnovaRouteGuard.protectPage([
            LearnovaConstants.ROLES.INSTRUCTOR,
            LearnovaConstants.ROLES.ADMIN
        ]);
    </script>


    <script src="../../js/pages/instructor/prerequisiteEditor.js"></script>


</body>

</html>
