<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Learnova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/pages/instructor.css">
    <link rel="stylesheet" href="../../css/pages/profile.css">
    <style>
        * { font-family: 'Cormorant Garamond', serif !important; }
    </style>
</head>
<body>
    <!-- Top Header Navigation -->
    <header class="top-nav">
        <a href="../../index.html" class="logo">Learnova</a>

        <div class="header-actions">
            <div class="role-pill" id="profileRolePill">
                <span id="profileRoleLabel">Account</span>
                <i class="fa-solid fa-chevron-down"></i>
            </div>
            <button class="icon-btn" aria-label="Notifications">
                <i class="fa-solid fa-bell"></i>
                <span class="notif-dot"></span>
            </button>
            <a class="profile-btn active" href="profile.html" aria-label="Profile">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </header>

    <!-- Secondary Navigation -->
    <nav class="secondary-nav">
        <button class="tab" id="profileBackLink">Back to Dashboard</button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="page-title">My Profile</h1>
        <p class="subtitle">View and update your account details.</p>

        <!-- Profile header -->
        <div class="profile-header card">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-meta">
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-email" id="profileEmail"></div>
                <div class="profile-badges" id="profileBadges"></div>
            </div>
            <div class="profile-status" id="profileStatus"><span class="status-badge active">Active</span></div>
        </div>

        <div class="profile-grid">
            <!-- Personal information -->
            <div class="card">
                <h3>Personal Information</h3>
                <p>Update your first and last name.</p>
                <form id="profileInfoForm" novalidate>
                    <div class="form-field">
                        <label for="profileFirstName">First name</label>
                        <input type="text" id="profileFirstName" autocomplete="given-name">
                    </div>
                    <div class="form-field">
                        <label for="profileLastName">Last name</label>
                        <input type="text" id="profileLastName" autocomplete="family-name">
                    </div>
                    <div class="form-field">
                        <label for="profileEmailDisplay">Email</label>
                        <input type="email" id="profileEmailDisplay" disabled>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>

            <!-- Change password -->
            <div class="card">
                <h3>Change Password</h3>
                <p>Use a password of at least 8 characters.</p>
                <form id="profilePasswordForm" novalidate>
                    <div class="form-field">
                        <label for="profileCurrentPassword">Current password</label>
                        <input type="password" id="profileCurrentPassword" autocomplete="current-password">
                    </div>
                    <div class="form-field">
                        <label for="profileNewPassword">New password</label>
                        <input type="password" id="profileNewPassword" autocomplete="new-password">
                    </div>
                    <div class="form-field">
                        <label for="profileConfirmPassword">Confirm new password</label>
                        <input type="password" id="profileConfirmPassword" autocomplete="new-password">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../../js/utils/constants.js"></script>
    <script src="../../js/auth/session.js"></script>
    <script src="../../js/auth/routeGuard.js"></script>
    <script src="../../js/shared/dashboardHeader.js"></script>
    <script src="../../js/components/dialogs.js"></script>
    <script>
        LearnovaRouteGuard.protectPage([
            LearnovaConstants.ROLES.STUDENT,
            LearnovaConstants.ROLES.INSTRUCTOR,
            LearnovaConstants.ROLES.ADMIN
        ]);
    </script>
    <script src="../../js/api/apiClient.js"></script>
    <script src="../../js/api/mock.js"></script>
    <script src="../../js/api/profileApi.js"></script>
    <script src="../../js/pages/common/profile.js"></script>
</body>
</html>
