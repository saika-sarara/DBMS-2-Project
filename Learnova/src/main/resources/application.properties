spring.application.name=learnova

# Database Connection (Spring Environment Configuration)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:learnova_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Super Admin Setup Configuration (Reads from Environment)
app.admin.email=${SUPER_ADMIN_EMAIL:admin@learnova.com}
app.admin.password=${SUPER_ADMIN_PASSWORD:AdminPass123!}
app.admin.fullName=${SUPER_ADMIN_FULL_NAME:Super Admin}

# JWT Security Credentials
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}