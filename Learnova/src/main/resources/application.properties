spring.application.name=learnova
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8000}

# Database Connection (Neon PostgreSQL). Credentials come ONLY from the
# environment / local .env file. Missing variables fail fast with a clear
# Spring "Could not resolve placeholder '<NAME>'" error naming the variable.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is owned and managed by Flyway migrations. Hibernate must never
# create or alter tables. `validate` is preferred (it must pass on Neon) and
# only checks the auth entities (users, roles, user_roles).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info

# JWT Security Credentials
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:${JWT_EXPIRATION:86400000}}

# Bootstrap admin (optional): creates the first ADMIN account on startup when
# BOOTSTRAP_ADMIN_ENABLED=true. Credentials come ONLY from the environment.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
app.bootstrap-admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
